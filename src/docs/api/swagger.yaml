openapi: 3.0.3
info:
  title: API Cardápio Digital
  version: 2.0.0
  description: API integrada ao frontend do cardápio, painel administrativo, caixa e entregas.
servers:
  - url: http://localhost:3000
    description: Ambiente local

tags:
  - name: Autenticação
  - name: Categorias
  - name: Pratos
  - name: Adicionais
  - name: Grupos de adicionais
  - name: Promoções
  - name: Configurações
  - name: Cargos
  - name: Funcionários
  - name: Entregadores
  - name: Pedidos

paths:
  /api/login:
    post:
      tags: [Autenticação]
      summary: Realiza login administrativo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categorias:
    get:
      tags: [Categorias]
      summary: Lista categorias
      responses:
        '200':
          description: Categorias encontradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Categoria' }
    post:
      tags: [Categorias]
      summary: Cria uma categoria
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaInput' }
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/categorias/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Categorias]
      summary: Busca uma categoria
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categorias]
      summary: Atualiza uma categoria
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaInput' }
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
    delete:
      tags: [Categorias]
      summary: Exclui uma categoria
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Categoria excluída }

  /api/pratos:
    get:
      tags: [Pratos]
      summary: Lista pratos
      responses:
        '200':
          description: Pratos encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Prato' }
    post:
      tags: [Pratos]
      summary: Cria um prato
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PratoInput' }
      responses:
        '201':
          description: Prato criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prato' }
  /api/pratos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pratos]
      summary: Busca um prato
      responses:
        '200':
          description: Prato encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prato' }
    put:
      tags: [Pratos]
      summary: Atualiza um prato
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PratoInput' }
      responses:
        '200': { description: Prato atualizado }
    delete:
      tags: [Pratos]
      summary: Exclui um prato
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Prato excluído }

  /api/adicionais:
    get:
      tags: [Adicionais]
      summary: Lista adicionais
      responses:
        '200':
          description: Adicionais encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Adicional' }
    post:
      tags: [Adicionais]
      summary: Cria um adicional
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdicionalInput' }
      responses:
        '201':
          description: Adicional criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adicional' }
  /api/adicionais/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Adicionais]
      summary: Busca um adicional
      responses:
        '200': { description: Adicional encontrado }
    put:
      tags: [Adicionais]
      summary: Atualiza um adicional
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdicionalInput' }
      responses:
        '200': { description: Adicional atualizado }
    delete:
      tags: [Adicionais]
      summary: Exclui um adicional
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Adicional excluído }

  /api/grupos-adicionais:
    get:
      tags: [Grupos de adicionais]
      summary: Lista grupos de adicionais
      responses:
        '200':
          description: Grupos encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrupoAdicional' }
    post:
      tags: [Grupos de adicionais]
      summary: Cria um grupo de adicionais
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoAdicionalInput' }
      responses:
        '201': { description: Grupo criado }
  /api/grupos-adicionais/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Grupos de adicionais]
      summary: Busca um grupo
      responses:
        '200': { description: Grupo encontrado }
    put:
      tags: [Grupos de adicionais]
      summary: Atualiza um grupo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoAdicionalInput' }
      responses:
        '200': { description: Grupo atualizado }
    delete:
      tags: [Grupos de adicionais]
      summary: Exclui um grupo
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Grupo excluído }

  /api/promocoes:
    get:
      tags: [Promoções]
      summary: Lista promoções
      responses:
        '200':
          description: Promoções encontradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promocao' }
    post:
      tags: [Promoções]
      summary: Cria uma promoção
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromocaoInput' }
      responses:
        '201': { description: Promoção criada }
  /api/promocoes/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Promoções]
      summary: Busca uma promoção
      responses:
        '200': { description: Promoção encontrada }
    put:
      tags: [Promoções]
      summary: Atualiza uma promoção
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromocaoInput' }
      responses:
        '200': { description: Promoção atualizada }
    delete:
      tags: [Promoções]
      summary: Exclui uma promoção
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Promoção excluída }

  /api/configuracoes:
    get:
      tags: [Configurações]
      summary: Obtém configurações públicas da loja
      responses:
        '200':
          description: Configuração encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuracao' }
    put:
      tags: [Configurações]
      summary: Salva configurações da loja
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfiguracaoInput' }
      responses:
        '200':
          description: Configuração salva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuracao' }

  /api/cargos:
    get:
      tags: [Cargos]
      summary: Lista cargos
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cargos encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Cargo' }
    post:
      tags: [Cargos]
      summary: Cria um cargo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CargoInput' }
      responses:
        '201': { description: Cargo criado }
  /api/cargos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Cargos]
      summary: Busca um cargo
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cargo encontrado }
    put:
      tags: [Cargos]
      summary: Atualiza um cargo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CargoInput' }
      responses:
        '200': { description: Cargo atualizado }
    delete:
      tags: [Cargos]
      summary: Exclui um cargo
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cargo excluído }

  /api/funcionarios:
    get:
      tags: [Funcionários]
      summary: Lista funcionários
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Funcionários encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Funcionario' }
    post:
      tags: [Funcionários]
      summary: Cria usuário e funcionário em uma transação
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuncionarioInput' }
      responses:
        '201': { description: Funcionário criado }
  /api/funcionarios/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Funcionários]
      summary: Busca um funcionário
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Funcionário encontrado }
    put:
      tags: [Funcionários]
      summary: Atualiza usuário e funcionário
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuncionarioInput' }
      responses:
        '200': { description: Funcionário atualizado }
    delete:
      tags: [Funcionários]
      summary: Exclui funcionário e usuário relacionado
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Funcionário excluído }

  /api/entregadores:
    get:
      tags: [Entregadores]
      summary: Lista entregadores
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Entregadores encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Entregador' }
    post:
      tags: [Entregadores]
      summary: Cria usuário, funcionário e perfil de entregador
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntregadorInput' }
      responses:
        '201': { description: Entregador criado }
  /api/entregadores/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Entregadores]
      summary: Busca um entregador
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Entregador encontrado }
    put:
      tags: [Entregadores]
      summary: Atualiza entregador e seu funcionário
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntregadorInput' }
      responses:
        '200': { description: Entregador atualizado }
    delete:
      tags: [Entregadores]
      summary: Exclui entregador, funcionário e usuário relacionados
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Entregador excluído }

  /api/pedidos:
    get:
      tags: [Pedidos]
      summary: Lista pedidos do painel
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pedidos encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pedido' }
    post:
      tags: [Pedidos]
      summary: Finaliza um pedido público do cardápio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoInput' }
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
  /api/pedidos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pedidos]
      summary: Busca um pedido
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pedido encontrado }
    put:
      tags: [Pedidos]
      summary: Atualiza status, entregador ou cancelamento
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoAtualizacao' }
      responses:
        '200': { description: Pedido atualizado }
    delete:
      tags: [Pedidos]
      summary: Exclui um pedido
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Pedido excluído }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Forbidden:
      description: Usuário sem permissão
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  schemas:
    Erro:
      type: object
      properties:
        message: { type: string, example: Registro não encontrado. }
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email, example: admin@demo.com }
        senha: { type: string, format: password, example: admin123 }
    LoginResponse:
      type: object
      properties:
        message: { type: string }
        token: { type: string }
        refreshToken: { type: string }
        user:
          type: object
          properties:
            id: { type: integer }
            nome: { type: string }
            email: { type: string }
            role: { type: string, example: Gerente }
    CategoriaInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string, example: Hambúrgueres }
        descricao: { type: string, nullable: true }
        imagem: { type: string, nullable: true }
        ativo: { type: boolean, default: true }
        ordem: { type: integer, default: 1 }
    Categoria:
      allOf:
        - type: object
          properties: { id: { type: integer } }
        - $ref: '#/components/schemas/CategoriaInput'
    PratoInput:
      type: object
      required: [nome, valor, categoriaId]
      properties:
        nome: { type: string, example: X-Burger }
        cozinha: { type: string, example: Cardápio }
        descricao_resumida: { type: string }
        descricao_detalhada: { type: string }
        imagem: { type: string, nullable: true }
        valor: { type: number, format: double, example: 29.9 }
        categoriaId: { type: integer }
        disponivel: { type: boolean, default: true }
        destaque: { type: boolean, default: false }
        ordem: { type: integer, default: 1 }
    Prato:
      allOf:
        - type: object
          properties: { id: { type: integer } }
        - $ref: '#/components/schemas/PratoInput'
    AdicionalInput:
      type: object
      required: [nomeAdicional, valor]
      properties:
        nomeAdicional: { type: string, example: Bacon extra }
        valor: { type: number, example: 5 }
        disponivel: { type: boolean, default: true }
    Adicional:
      allOf:
        - type: object
          properties: { id: { type: integer } }
        - $ref: '#/components/schemas/AdicionalInput'
    GrupoAdicionalInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string, example: Escolha seus adicionais }
        obrigatorio: { type: boolean }
        maxSelecoes: { type: integer, minimum: 1 }
        ativo: { type: boolean }
        pratoIds: { type: array, items: { type: integer } }
        adicionalIds: { type: array, items: { type: integer } }
    GrupoAdicional:
      allOf:
        - type: object
          properties:
            id: { type: integer }
            items:
              type: array
              items: { $ref: '#/components/schemas/Adicional' }
        - $ref: '#/components/schemas/GrupoAdicionalInput'
    PromocaoInput:
      type: object
      required: [titulo]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        imagem: { type: string }
        produtoIds: { type: array, items: { type: integer } }
        precosPromocionais: { type: object, additionalProperties: { type: number } }
        ativo: { type: boolean }
        clicavel: { type: boolean }
        selo: { type: string }
        inicio: { type: string, format: date-time, nullable: true }
        fim: { type: string, format: date-time, nullable: true }
        ordem: { type: integer }
    Promocao:
      allOf:
        - type: object
          properties: { id: { type: integer } }
        - $ref: '#/components/schemas/PromocaoInput'
    ConfiguracaoInput:
      type: object
      properties:
        nomeLoja: { type: string }
        descricao: { type: string }
        numeroLoja: { type: string }
        chavePix: { type: string }
        titularPix: { type: string }
        valorFrete: { type: number }
        pedidoMinimo: { type: number, nullable: true }
        slugCardapio: { type: string }
        prazoEntrega: { type: string }
        horarioFuncionamento: { type: string }
        aberto: { type: boolean }
        corPrimaria: { type: string }
        capaUrl: { type: string }
    Configuracao:
      allOf:
        - type: object
          properties: { id: { type: integer } }
        - $ref: '#/components/schemas/ConfiguracaoInput'
    CargoInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string, example: Caixa }
        descricao: { type: string, nullable: true }
        permissoes: { type: array, items: { type: string } }
        ativo: { type: boolean, default: true }
    Cargo:
      allOf:
        - type: object
          properties: { id: { type: integer } }
        - $ref: '#/components/schemas/CargoInput'
    FuncionarioInput:
      type: object
      required: [nome, email, cargoId]
      properties:
        nome: { type: string }
        email: { type: string, format: email }
        senha: { type: string, format: password, description: Obrigatória na criação }
        telefone: { type: string, nullable: true }
        cargoId: { type: integer }
        ativo: { type: boolean }
    Funcionario:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        telefone: { type: string, nullable: true }
        ativo: { type: boolean }
        user: { type: object }
        cargo: { $ref: '#/components/schemas/Cargo' }
    EntregadorInput:
      type: object
      required: [nome, email, veiculo]
      properties:
        nome: { type: string }
        email: { type: string, format: email }
        senha: { type: string, format: password, description: Obrigatória na criação }
        telefone: { type: string, nullable: true }
        documento: { type: string, nullable: true }
        veiculo: { type: string }
        placa: { type: string, nullable: true }
        disponivel: { type: boolean }
        ativo: { type: boolean }
    Entregador:
      type: object
      properties:
        id: { type: integer }
        documento: { type: string, nullable: true }
        veiculo: { type: string }
        placa: { type: string, nullable: true }
        disponivel: { type: boolean }
        ativo: { type: boolean }
        funcionario: { $ref: '#/components/schemas/Funcionario' }
    PedidoItemInput:
      type: object
      required: [pratoId, quantidade, precoUnitario]
      properties:
        pratoId: { type: integer }
        quantidade: { type: integer, minimum: 1 }
        precoUnitario: { type: number }
        observacao: { type: string }
        adicionais: { type: array, items: { type: object } }
    PedidoInput:
      type: object
      required: [clienteNome, clienteTelefone, itens]
      properties:
        clienteNome: { type: string }
        clienteTelefone: { type: string }
        endereco: { type: object }
        pagamento: { type: object }
        valorFrete: { type: number }
        desconto: { type: number }
        itens:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PedidoItemInput' }
    PedidoAtualizacao:
      type: object
      properties:
        status:
          type: string
          enum: [pending, sent, confirmed, preparing, ready, out_for_delivery, delivered, cancelled]
        entregadorId: { type: integer, nullable: true }
        entregadorNome: { type: string, nullable: true }
        motivoCancelamento: { type: string, nullable: true }
    Pedido:
      allOf:
        - type: object
          properties:
            id: { type: integer }
            codigo: { type: string }
            subtotal: { type: number }
            total: { type: number }
            status: { type: string }
            itens: { type: array, items: { type: object } }
        - $ref: '#/components/schemas/PedidoInput'
